[project]
name = "daisy-search"
version = "0.1.0"
description = "Personal identity exposure and OSINT research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "rq>=2.1.0",
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.0",
    "redis>=7.3.0",
    "mcp>=1.26.0",
    "neo4j>=6.1.0",
    "boto3>=1.43.29",
]

[project.scripts]
daisy = "daisy.cli:main"
daisy-mcp = "daisy.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daisy"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
