services:
  postgres:
    image: postgres:16-alpine
    container_name: daisy-postgres
    environment:
      POSTGRES_DB: daisy
      POSTGRES_USER: daisy
      POSTGRES_PASSWORD: daisy_dev
    ports:
      - "5432:5432"
    volumes:
      - daisy_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: daisy-redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    container_name: daisy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/daisy_dev
    volumes:
      - daisy_neo4j:/data

  searxng:
    image: searxng/searxng:latest
    container_name: daisy-searxng
    ports:
      - "9741:8080"
    volumes:
      - ./searxng-config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:9741/

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: daisy-crawl4ai
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=daisy-c4ai-token
      - CRAWL4AI_EXECUTE_JS_ENABLED=true
      - OLLAMA_BASE_URL=http://beefybox:11434
    shm_size: '2gb'

volumes:
  daisy_pgdata:
  daisy_neo4j:
